    <main class="page-shell py-5">
      <section class="container">
        <div class="row justify-content-center">
          <div class="col-lg-5">
            <div class="card border-0 rounded-4 shadow-sm">
              <div class="card-body p-4 p-lg-5">
                <span class="badge text-bg-warning mb-3">Primeiro acesso</span>
                <h1 class="h3 fw-semibold mb-2">Trocar senha inicial</h1>
                <p class="page-copy mb-4">Defina uma nova senha para continuar usando o sistema.</p>

                <form [formGroup]="form" (ngSubmit)="submit()">
                  <app-change-password-fields
                    [form]="form"
                    [hasFieldError]="hasFieldErrorFn"
                    [getFieldError]="getFieldErrorFn"
                  />

                  @if (message()) {
                    <div class="alert alert-success py-2 mt-3">{{ message() }}</div>
                  }

                  @if (errorMessage()) {
                    <div class="alert alert-danger py-2 mt-3">{{ errorMessage() }}</div>
                  }

                  <app-button class="mt-3 w-100" type="submit" [block]="true" [disabled]="loading()">
                    @if (loading()) {
                      Salvando...
                    } @else {
                      Atualizar senha
                    }
                  </app-button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
