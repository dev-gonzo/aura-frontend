<div class="form-field markdown-editor-field">
  <label class="form-label" [class.field-label-invalid]="invalid" [attr.for]="inputId">
    {{ label }}@if (required) { * }
  </label>

  <div class="editor-shell" [class.is-invalid]="invalid">
    <div #editorHost class="editor-host"></div>
  </div>

  @if (errorText) {
    <div class="validation-helper">{{ errorText }}</div>
  } @else if (helperText) {
    <div class="field-helper">{{ helperText }}</div>
  }
</div>
